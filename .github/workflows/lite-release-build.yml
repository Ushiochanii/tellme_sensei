name: Vision Lite release build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/vision-lite

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: Build Vision Lite macOS ARM64
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify native runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test "$(python -c 'import platform; print(platform.machine())')" = "arm64"

      - name: Install Lite build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build Lite app and DMG
        run: ./scripts/build_vision_lite_macos_arm64.sh

      - name: Verify Lite artifact
        run: |
          set -euo pipefail
          test -s dist/release/TellMeSensei-Lite-0.1.0-macos-arm64.dmg
          app="dist/vision-lite-macos-arm64/TellMeSensei Lite.app"
          file "$app/Contents/MacOS/TellMeSenseiLite" | grep -F "Mach-O 64-bit executable arm64"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "com.tellmesensei.vision-lite"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")" = "0.1.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$app/Contents/Info.plist")" = "true"

      - name: Upload Lite DMG
        uses: actions/upload-artifact@v4
        with:
          name: TellMeSensei-Lite-0.1.0-macos-arm64.dmg
          path: dist/release/TellMeSensei-Lite-0.1.0-macos-arm64.dmg
          if-no-files-found: error
