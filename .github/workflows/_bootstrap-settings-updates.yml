name: Apply Settings Updates patch

on:
  push:
    branches:
      - feature/settings-updates

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/settings-updates

      - name: Apply Settings patch
        run: python scripts/_apply_settings_updates_patch.py

      - name: Commit feature patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_bootstrap-settings-updates.yml
          git rm scripts/_apply_settings_updates_patch.py
          git add app/ui/settings_window.py
          git commit -m "feat: add application updates page to Settings"
          git push origin HEAD:feature/settings-updates
