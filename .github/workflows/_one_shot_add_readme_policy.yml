name: One-shot add README documentation policy

on:
  push:
    branches:
      - docs/readme-update-policy

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: docs/readme-update-policy

      - name: Add README and user documentation policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("AGENTS.md")
          text = path.read_text(encoding="utf-8")
          marker = "\n---\n\n## 5. 写代码之前\n"
          section = (
              "\n\n### 4.5 README 与用户文档\n\n"
              "README 和面向用户的文档描述的是当前软件如何安装、配置和使用。用户可见行为发生变化时，文档更新应属于实现本身，而不是事后补写。\n\n"
              "- 新增或改变用户可见功能、Settings 配置项、快捷键、安装/更新流程、支持平台、CLI 参数或其他公开使用方式时，应在同一个实现 PR 中同步更新相关 README / 用户文档。\n"
              "- 纯内部重构、测试调整或用户无感的修复，如果现有文档仍然准确，不要为了流程形式强行修改 README。\n"
              "- 分阶段功能可以在底层 Phase 暂不更新 README，但最迟应在功能首次形成可供用户使用的 Phase PR 中完成对应文档更新。\n"
              "- Release preparation 应再次检查 README、版本信息、安装说明和 Release Notes 是否一致，但这是最终一致性检查，不应成为首次补写用户文档的阶段。\n"
              "- Release Notes 负责说明‘这个版本改变了什么’；README / 用户文档负责说明‘当前版本如何使用’。两者不能互相替代。\n"
          )
          if "### 4.5 README 与用户文档" not in text:
              if marker not in text:
                  raise SystemExit("AGENTS.md insertion marker not found")
              text = text.replace(marker, section + marker, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit policy and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_one_shot_add_readme_policy.yml
          git add AGENTS.md
          git commit -m "docs: require user-facing documentation updates"
          git push origin HEAD:docs/readme-update-policy
