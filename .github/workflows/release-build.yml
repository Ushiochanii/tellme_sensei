name: Release build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
      - "!v*-*"

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build Windows x64 application
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = (python -c "from app.version import __version__; print(__version__)").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
            throw "Could not read the application version from app.version."
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

      - name: Install Core build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build Windows installer
        shell: pwsh
        run: .\scripts\build_installer.ps1

      - name: Verify Windows installer
        shell: pwsh
        run: |
          $installer = Join-Path $env:GITHUB_WORKSPACE "dist\installer\TellMeSensei-Setup-${{ steps.version.outputs.version }}.exe"
          $portable = Join-Path $env:GITHUB_WORKSPACE "dist\TellMeSensei\TellMeSensei.exe"
          if (-not (Test-Path -LiteralPath $portable)) {
            throw "Packaged application executable was not created: $portable"
          }
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Installer was not created: $installer"
          }
          $file = Get-Item -LiteralPath $installer
          if ($file.Length -le 0) {
            throw "Installer is empty: $installer"
          }
          $bytes = [System.IO.File]::ReadAllBytes($portable)
          if ($bytes.Length -lt 0x40 -or [System.BitConverter]::ToUInt16($bytes, 0) -ne 0x5A4D) {
            throw "Packaged application is not a PE executable: $portable"
          }
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
          if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length -or
              [System.BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x00004550 -or
              [System.BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) {
            throw "Packaged application is not a Windows x64 PE: $portable"
          }
          Write-Host "Runner architecture: $env:PROCESSOR_ARCHITECTURE"
          Write-Host "Python: $(python --version)"
          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") {
            throw "Expected Windows x64 runner, got $env:PROCESSOR_ARCHITECTURE"
          }
          Write-Host "Installer: $($file.FullName) ($($file.Length) bytes)"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: TellMeSensei-Setup-${{ steps.version.outputs.version }}.exe
          path: dist/installer/TellMeSensei-Setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

  build-macos-x64:
    name: Build macOS Intel x64 application
    runs-on: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Intel runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          test "$(python -c 'import platform; print(platform.machine())')" = "x86_64"
          echo "Runner architecture: $(uname -m)"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read application version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'from app.version import __version__; print(__version__)')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Core build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build macOS Intel app and DMG
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build_macos.sh
          ./scripts/package_macos_dmg.sh

      - name: Verify macOS Intel DMG
        shell: bash
        run: |
          set -euo pipefail
          executable="dist/macos/TellMeSensei.app/Contents/MacOS/TellMeSensei"
          dmg="dist/release/TellMeSensei-${{ steps.version.outputs.version }}-macos-x64.dmg"
          test -f "$dmg"
          test -s "$dmg"
          file "$executable"
          file "$executable" | grep -F "Mach-O 64-bit executable x86_64"
          echo "Runner architecture: $(uname -m)"
          echo "Python: $(python --version)"
          echo "DMG: $(stat -f '%z bytes' "$dmg")"

      - name: Upload macOS Intel DMG
        uses: actions/upload-artifact@v4
        with:
          name: TellMeSensei-${{ steps.version.outputs.version }}-macos-x64.dmg
          path: dist/release/TellMeSensei-${{ steps.version.outputs.version }}-macos-x64.dmg
          if-no-files-found: error

  build-macos-arm64:
    name: Build macOS Apple Silicon ARM64 application
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify ARM64 runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test "$(python -c 'import platform; print(platform.machine())')" = "arm64"
          echo "Runner architecture: $(uname -m)"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read application version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'from app.version import __version__; print(__version__)')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Core build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build macOS ARM64 app and DMG
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build_macos.sh
          ./scripts/package_macos_dmg.sh

      - name: Verify macOS ARM64 DMG
        shell: bash
        run: |
          set -euo pipefail
          executable="dist/macos/TellMeSensei.app/Contents/MacOS/TellMeSensei"
          dmg="dist/release/TellMeSensei-${{ steps.version.outputs.version }}-macos-arm64.dmg"
          test -f "$dmg"
          test -s "$dmg"
          file "$executable"
          file "$executable" | grep -F "Mach-O 64-bit executable arm64"
          echo "Runner architecture: $(uname -m)"
          echo "Python: $(python --version)"
          echo "DMG: $(stat -f '%z bytes' "$dmg")"

      - name: Upload macOS ARM64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: TellMeSensei-${{ steps.version.outputs.version }}-macos-arm64.dmg
          path: dist/release/TellMeSensei-${{ steps.version.outputs.version }}-macos-arm64.dmg
          if-no-files-found: error

  publish-stable-release:
    name: Publish stable GitHub Release
    if: github.event_name == 'push'
    needs:
      - build-windows-x64
      - build-macos-x64
      - build-macos-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a stable application tag: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          app_version="$(python3 -c 'from app.version import __version__; print(__version__)')"
          if [[ "$app_version" != "$version" ]]; then
            echo "Tag $tag does not match app.version $app_version" >&2
            exit 1
          fi
          notes="docs/releases/${tag}.md"
          if [[ ! -f "$notes" ]]; then
            echo "Missing release notes: $notes" >&2
            exit 1
          fi

      - name: Download validated build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: TellMeSensei-*
          path: release-assets
          merge-multiple: true

      - name: Verify release asset names
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          expected=(
            "TellMeSensei-Setup-${version}.exe"
            "TellMeSensei-${version}-macos-x64.dmg"
            "TellMeSensei-${version}-macos-arm64.dmg"
          )
          for name in "${expected[@]}"; do
            if [[ ! -f "release-assets/$name" ]]; then
              echo "Missing expected release asset: $name" >&2
              exit 1
            fi
          done

      - name: Create stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "release-assets/TellMeSensei-Setup-${version}.exe" \
            "release-assets/TellMeSensei-${version}-macos-x64.dmg" \
            "release-assets/TellMeSensei-${version}-macos-arm64.dmg" \
            --verify-tag \
            --title "TellMeSensei $GITHUB_REF_NAME" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
            --latest
