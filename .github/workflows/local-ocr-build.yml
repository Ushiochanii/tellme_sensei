name: Local OCR build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_REPOSITORY: Ushiochanii/tellme_sensei
  RELEASE_TAG: local-ocr-v1.4.0
  RELEASE_BASE_URL: https://github.com/Ushiochanii/tellme_sensei/releases/download/local-ocr-v1.4.0

jobs:
  build-windows-x64:
    name: Build Local OCR Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Local OCR dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-local-ocr.txt
          python -m pip install "pyinstaller>=6.0,<7.0"

      - name: Build Local OCR worker
        shell: pwsh
        run: .\scripts\build_local_ocr.ps1

      - name: Package Local OCR artifacts
        shell: pwsh
        run: .\scripts\package_local_ocr.ps1 -DistributionRepository $env:RELEASE_REPOSITORY

      - name: Verify Windows x64 worker and manifest
        shell: pwsh
        run: |
          $worker = Join-Path $env:GITHUB_WORKSPACE "dist\LocalOCR\TellMeSenseiOCR.exe"
          $archive = Join-Path $env:GITHUB_WORKSPACE "dist\components\TellMeSensei-LocalOCR-1.4.0-windows-x64.zip"
          $manifest = Join-Path $env:GITHUB_WORKSPACE "dist\components\local-ocr-manifest-windows-x64.json"
          foreach ($path in @($worker, $archive, $manifest)) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing artifact: $path" }
          }
          $bytes = [System.IO.File]::ReadAllBytes($worker)
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
          if ([System.BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x00004550 -or
              [System.BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) {
            throw "Local OCR worker is not a Windows x64 PE executable"
          }
          $metadata = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          if ($metadata.version -ne "1.4.0" -or $metadata.platform -ne "windows" -or
              $metadata.arch -ne "x86_64" -or $metadata.url -ne
              "$env:RELEASE_BASE_URL/TellMeSensei-LocalOCR-1.4.0-windows-x64.zip") {
            throw "Windows Local OCR manifest metadata is invalid"
          }
          $archiveInfo = Get-Item -LiteralPath $archive
          if ([int64]$metadata.size -ne [int64]$archiveInfo.Length) {
            throw "Windows Local OCR manifest size does not match archive"
          }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($metadata.sha256.ToLowerInvariant() -ne $hash) {
            throw "Windows Local OCR manifest SHA-256 does not match archive"
          }
          Write-Host "Runner architecture: $env:PROCESSOR_ARCHITECTURE"
          Write-Host "Python: $(python --version)"
          Write-Host "Archive: $($archiveInfo.Length) bytes"

      - name: Upload Windows Local OCR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LocalOCR-1.4.0-windows-x64
          path: |
            dist/components/TellMeSensei-LocalOCR-1.4.0-windows-x64.zip
            dist/components/local-ocr-manifest-windows-x64.json
          if-no-files-found: error

  build-macos-x64:
    name: Build Local OCR macOS Intel x64
    runs-on: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Intel runner
        run: |
          test "$(uname -m)" = "x86_64"
          test "$(python -c 'import platform; print(platform.machine())')" = "x86_64"

      - name: Install Intel Local OCR dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c packaging/macos/local_ocr_x64_constraints.txt -r requirements-local-ocr.txt
          python -m pip install -c packaging/macos/local_ocr_x64_constraints.txt "pyinstaller>=6.0,<7.0"

      - name: Download Japanese models for packaging
        run: |
          python - <<'PY'
          from paddleocr import PaddleOCR
          PaddleOCR(lang="japan", use_angle_cls=False)
          PY

      - name: Build Intel Local OCR worker
        run: ./scripts/build_local_ocr_macos.sh

      - name: Package Intel Local OCR artifacts
        env:
          TELLME_LOCAL_OCR_BASE_URL: ${{ env.RELEASE_BASE_URL }}
        run: ./scripts/package_local_ocr_macos.sh

      - name: Verify Intel worker and manifest
        run: |
          set -euo pipefail
          worker=dist/local-ocr-macos-x64/LocalOCR/TellMeSenseiOCR
          archive=dist/components-macos-x64/TellMeSensei-LocalOCR-1.4.0-macos-x64.zip
          manifest=dist/components-macos-x64/local-ocr-manifest-macos-x64.json
          test -x "$worker" && test -s "$archive" && test -f "$manifest"
          file "$worker" | grep -F "Mach-O 64-bit executable x86_64"
          python - "$archive" "$manifest" <<'PY'
          import hashlib, json, pathlib, sys
          archive = pathlib.Path(sys.argv[1])
          metadata = json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert metadata["schema_version"] == 1
          assert metadata["component"] == "local-ocr"
          assert metadata["version"] == "1.4.0"
          assert metadata["platform"] == "macos"
          assert metadata["arch"] == "x86_64"
          assert metadata["url"] == "https://github.com/Ushiochanii/tellme_sensei/releases/download/local-ocr-v1.4.0/" + archive.name
          assert metadata["size"] == archive.stat().st_size
          assert metadata["sha256"] == hashlib.sha256(archive.read_bytes()).hexdigest()
          assert metadata["archive_format"] == "zip"
          PY
          echo "Runner architecture: $(uname -m)"
          python --version
          stat -f '%z bytes' "$archive"

      - name: Upload Intel Local OCR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LocalOCR-1.4.0-macos-x64
          path: |
            dist/components-macos-x64/TellMeSensei-LocalOCR-1.4.0-macos-x64.zip
            dist/components-macos-x64/local-ocr-manifest-macos-x64.json
          if-no-files-found: error

  build-macos-arm64:
    name: Build Local OCR macOS ARM64
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify ARM64 runner
        run: |
          test "$(uname -m)" = "arm64"
          test "$(python -c 'import platform; print(platform.machine())')" = "arm64"

      - name: Install ARM64 Local OCR dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/macos/local_ocr_arm64_build_requirements.txt

      - name: Download Japanese models for packaging
        run: |
          python - <<'PY'
          from paddleocr import PaddleOCR
          PaddleOCR(
              lang="japan",
              text_detection_model_name="PP-OCRv6_medium_det",
              text_recognition_model_name="PP-OCRv6_medium_rec",
              use_doc_orientation_classify=False,
              use_doc_unwarping=False,
              use_textline_orientation=False,
          )
          PY

      - name: Build ARM64 Local OCR worker
        run: ./scripts/build_local_ocr_macos_arm64.sh

      - name: Package ARM64 Local OCR artifacts
        env:
          TELLME_LOCAL_OCR_SOURCE: ${{ github.workspace }}/dist/local-ocr-macos-arm64/LocalOCR
          TELLME_LOCAL_OCR_OUTPUT: ${{ github.workspace }}/dist/components-macos-arm64
          TELLME_LOCAL_OCR_BASE_URL: ${{ env.RELEASE_BASE_URL }}
          TELLME_LOCAL_OCR_MANIFEST_ARCH: arm64
          TELLME_LOCAL_OCR_ARCHIVE_ARCH: arm64
        run: ./scripts/package_local_ocr_macos.sh

      - name: Verify ARM64 worker and manifest
        run: |
          set -euo pipefail
          worker=dist/local-ocr-macos-arm64/LocalOCR/TellMeSenseiOCR
          archive=dist/components-macos-arm64/TellMeSensei-LocalOCR-1.4.0-macos-arm64.zip
          manifest=dist/components-macos-arm64/local-ocr-manifest-macos-arm64.json
          test -x "$worker" && test -s "$archive" && test -f "$manifest"
          file "$worker" | grep -F "Mach-O 64-bit executable arm64"
          python - "$archive" "$manifest" <<'PY'
          import hashlib, json, pathlib, sys
          archive = pathlib.Path(sys.argv[1])
          metadata = json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert metadata["schema_version"] == 1
          assert metadata["component"] == "local-ocr"
          assert metadata["version"] == "1.4.0"
          assert metadata["platform"] == "macos"
          assert metadata["arch"] == "arm64"
          assert metadata["url"] == "https://github.com/Ushiochanii/tellme_sensei/releases/download/local-ocr-v1.4.0/" + archive.name
          assert metadata["size"] == archive.stat().st_size
          assert metadata["sha256"] == hashlib.sha256(archive.read_bytes()).hexdigest()
          assert metadata["archive_format"] == "zip"
          PY
          echo "Runner architecture: $(uname -m)"
          python --version
          stat -f '%z bytes' "$archive"

      - name: Upload ARM64 Local OCR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LocalOCR-1.4.0-macos-arm64
          path: |
            dist/components-macos-arm64/TellMeSensei-LocalOCR-1.4.0-macos-arm64.zip
            dist/components-macos-arm64/local-ocr-manifest-macos-arm64.json
          if-no-files-found: error
