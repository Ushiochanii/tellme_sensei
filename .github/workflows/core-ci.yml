name: Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            qt_platform: offscreen
    env:
      QT_QPA_PLATFORM: ${{ matrix.qt_platform }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Core development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run tests
        if: runner.os != 'macOS'
        run: pytest

      - name: Run macOS tests in isolated batches
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # PySide6 on the hosted macOS runner can crash during interpreter
          # teardown only when the entire suite shares one process. Keep the
          # test set unchanged, but give the native Qt runtime two lifetimes.
          test_files=(tests/test_*.py)
          midpoint=$(( (${#test_files[@]} + 1) / 2 ))
          pytest "${test_files[@]:0:midpoint}"
          pytest "${test_files[@]:midpoint}"

      - name: Compile Python sources
        run: python -m compileall app gui.py main.py local_ocr_worker.py

      - name: Run Core smoke
        run: python gui.py --smoke-core

  core-windows:
    name: Core (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: ""
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Core development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run Windows tests file by file
        shell: pwsh
        run: |
          $testFiles = @(
            Get-ChildItem -Path tests -Filter 'test_*.py' -File |
              Sort-Object -Property FullName
          )
          if ($testFiles.Count -eq 0) {
            throw 'No tests/test_*.py files found.'
          }

          foreach ($testFile in $testFiles) {
            Write-Host "===== Running $($testFile.Name) ====="
            python -m pytest -vv "$($testFile.FullName)"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Compile Python sources
        run: python -m compileall app gui.py main.py local_ocr_worker.py

      - name: Run Core smoke
        run: python gui.py --smoke-core
