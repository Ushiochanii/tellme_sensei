name: Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            qt_platform: ""
          - os: macos-latest
            qt_platform: offscreen
    env:
      QT_QPA_PLATFORM: ${{ matrix.qt_platform }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Core development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Compile Python sources
        run: python -m compileall app gui.py main.py local_ocr_worker.py

      - name: Run Core smoke
        run: python gui.py --smoke-core
